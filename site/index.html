<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TokenPlan | AI coding prices</title>
    <meta
      name="description"
      content="Compare subscriptions and API rates in USD and PKR, with source links for each quote."
    />
    <meta name="theme-color" content="#faf8ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1628" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/src/assets/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("supercli-theme");
          if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
        } catch {}
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TokenPlan" />
    <meta property="og:title" content="TokenPlan | AI coding prices" />
    <meta
      property="og:description"
      content="Compare subscriptions and API rates in USD and PKR, with source links for each quote."
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
