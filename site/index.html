<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-N4B37CX2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
    <!--seo-head-->
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141415" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" href="/src/assets/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("tokenplan-theme");
          if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="app"><!--seo-body--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
