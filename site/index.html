<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TokenPlan | Compare AI coding plan prices</title>
    <meta
      name="description"
      content="Compare AI coding subscriptions and API token prices on one page, in USD and PKR, with an official source for every price."
    />
    <meta name="theme-color" content="#edf0f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c111b" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="/src/assets/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("tokenplan-theme");
          if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
        } catch {}
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TokenPlan" />
    <meta property="og:title" content="TokenPlan | Compare AI coding plan prices" />
    <meta
      property="og:description"
      content="Compare AI coding subscriptions and API token prices on one page, in USD and PKR, with an official source for every price."
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
