name: Daily sync (rankings and USD catalog)

on:
  schedule:
    - cron: "17 1 * * *" # daily at 01:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-rankings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh rankings and derive the USD catalog
        run: pnpm sync
      - run: pnpm check
      - run: node scripts/render-readme.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date=$(node -p 'require("./data/rankings.json").snapshotDate')
          git commit -am "data(daily): ranking snapshot ${date}"
          git push
