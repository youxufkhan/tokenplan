name: Daily sync

on:
  schedule:
    - cron: "17 1 * * *" # daily at 01:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check independent sources and capture outcomes
        run: node scripts/sync-run.mjs
      - run: node scripts/derive-usd.mjs
      - run: pnpm check
      - run: pnpm test
      - run: node scripts/render-readme.mjs
      - name: Open or update the price-drift issue
        if: always()
        run: |
          [ -s .sync-report.md ] || exit 0
          gh label create price-drift --color d93f0b 2>/dev/null || true
          n=$(gh issue list --label price-drift --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file .sync-report.md
          else gh issue create --label price-drift --title "Price drift report" --body-file .sync-report.md; fi
      - name: Retain source observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: |
            .sync-report.json
            .sync-report.md
      - name: Validate generated site
        run: |
          pnpm -C site install --frozen-lockfile
          pnpm verify
      - name: Commit and push to main
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "data(daily): $(date -u +%F)"
          git pull --rebase
          git push
